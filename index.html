<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відеоплеєр</title>
    <!-- Підключаємо бібліотеку для підтримки m3u8 (HLS) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            width: 80%;
            max-width: 800px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-color: #000; /* Чорний фон, поки відео вантажиться */
        }
    </style>
</head>
<body>

<div class="video-container">
    <!-- Базовий тег відео з обов'язковим атрибутом controls -->
    <video id="my-video" controls preload="auto"></video>
</div>

<script>
    const video = document.getElementById('my-video');
    
    // ВКАЖИ ТУТ НАЗВУ СВОГО ФАЙЛУ (наприклад: 'video.mp4' або посилання на '.m3u8')
    const videoSource = 'video.mp4'; 

    if (videoSource.endsWith('.m3u8') && Hls.isSupported()) {
        // Логіка для відтворення стрімінгів m3u8
        const hls = new Hls();
        hls.loadSource(videoSource);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            console.log('HLS-потік успішно завантажено.');
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
            console.error('Помилка завантаження HLS:', data);
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl') || videoSource.endsWith('.mp4')) {
        // Логіка для звичайних MP4 або браузерів (як Safari), що самі читають m3u8
        video.src = videoSource;
    } else {
        console.error('Формат відео не підтримується цим браузером.');
    }
</script>

</body>
</html>
